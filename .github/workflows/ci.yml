name: CI/CD Pipeline - Tem-Fé

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:
    # Permite disparar o pipeline (incluindo o deploy) manualmente pela aba Actions

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # No GitHub Actions (ubuntu-latest) o Chrome já vem instalado nativamente,
      # então o Karma consegue rodar sem problemas em modo Headless.
      - name: Run Angular Unit Tests
        run: npm run test -- --no-watch --browsers=ChromeHeadless

      - name: Setup Environment Config
        run: cp src/app/app.config.example.ts src/app/app.config.ts

      - name: Build Angular Project
        run: npm run build

  security-scans:
    name: Security Scans (IaC, Secrets, DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gitleaks (Secret Detection)
        run: npm run scan:secrets || true
        # '|| true' usado para não travar a esteira caso ache vulnerabilidades que decidimos assumir o risco

      - name: Checkov (IaC Scan)
        run: npm run scan:checkov || true

      - name: Snyk (Dependency Scan)
        run: npm run scan:snyk || true

      - name: Socket Security Scan
        run: npx socket ci --org paschoal-open-soucer --no-interactive
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}

      - name: Verify NPM Provenance and Signatures
        run: npm audit signatures || true
        # Verifica a autenticidade dos pacotes que possuem o selo Provenance.
        # Está com '|| true' porque muitos pacotes antigos do ecosistema ainda não adotaram o selo.

      - name: Setup Environment Config
        run: cp src/app/app.config.example.ts src/app/app.config.ts

      - name: Build Cloud Functions
        run: |
          npm install --prefix functions
          npm run build --prefix functions

      - name: Start Firebase Emulators
        run: docker compose up --build -d firebase-emulators

      - name: Wait for Emulators and Run Seed
        run: |
          npx wait-on http://localhost:9099 -t 60000
          node scripts/seed-master.mjs

      - name: Start Angular App for ZAP
        run: npm start &
        
      - name: Wait for App to be ready
        run: npx wait-on http://localhost:4200 -t 90000

      - name: OWASP ZAP (Baseline Scan)
        run: npm run scan:owasp || true

      - name: Nuclei (Vulnerability Scan)
        run: npm run scan:nuclei || true

  deploy:
    name: Deploy Firebase (produção)
    runs-on: ubuntu-latest
    needs: [build-and-test, security-scans]
    # Só roda com a variável DEPLOY_ENABLED=true (Settings > Secrets and variables > Actions > Variables)
    # e apenas em push na master ou disparo manual — nunca em pull request.
    if: |
      vars.DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')))
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # O app.config.ts de produção (credenciais reais do Firebase Web App) vem
      # inteiro do secret PROD_APP_CONFIG_TS — nunca é commitado no repositório.
      - name: Write Production App Config
        run: printf '%s' "$PROD_APP_CONFIG_TS" > src/app/app.config.ts
        env:
          PROD_APP_CONFIG_TS: ${{ secrets.PROD_APP_CONFIG_TS }}

      - name: Build Angular Project
        run: npm run build

      - name: Build Cloud Functions
        run: |
          npm install --prefix functions
          npm run build --prefix functions

      # Service account com papéis de deploy (ver docs/DEPLOY.md, seção 8).
      # Exporta GOOGLE_APPLICATION_CREDENTIALS, que o firebase-tools usa.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # --force confirma automaticamente prompts (ex.: deleção de functions removidas do código)
      - name: Deploy to Firebase
        run: npx firebase deploy --project prod --only hosting,firestore:rules,firestore:indexes,storage,functions --non-interactive --force
