name: CI/CD Pipeline - Tem-Fé

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # No GitHub Actions (ubuntu-latest) o Chrome já vem instalado nativamente,
      # então o Karma consegue rodar sem problemas em modo Headless.
      - name: Run Angular Unit Tests
        run: npm run test -- --no-watch --browsers=ChromeHeadless

      - name: Build Angular Project
        run: npm run build

  security-scans:
    name: Security Scans (IaC, Secrets, DAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Gitleaks (Secret Detection)
        run: npm run scan:secrets || true
        # '|| true' usado para não travar a esteira caso ache vulnerabilidades que decidimos assumir o risco

      - name: Checkov (IaC Scan)
        run: npm run scan:checkov || true

      - name: Snyk (Dependency Scan)
        run: npm run scan:snyk || true

      - name: Verify NPM Provenance and Signatures
        run: npm audit signatures || true
        # Verifica a autenticidade dos pacotes que possuem o selo Provenance.
        # Está com '|| true' porque muitos pacotes antigos do ecosistema ainda não adotaram o selo.

      - name: Start Angular App for ZAP
        run: npm start &
        
      - name: Wait for App to be ready
        run: npx wait-on http://localhost:4200 -t 90000

      - name: OWASP ZAP (Baseline Scan)
        run: npm run scan:owasp || true

  deploy:
    name: Deploy to Firebase Hosting
    needs: [build-and-test, security-scans]
    # Executa o deploy automaticamente APENAS se o push for na branch master/main
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build App
        run: npm run build

      - name: Deploy to Firebase
        uses: w9jds/firebase-action@master
        with:
          args: deploy
        env:
          # É necessário gerar este token executando 'firebase login:ci' na sua máquina
          # E então cadastrar como Secret no repositório GitHub (Settings > Secrets > Actions)
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
