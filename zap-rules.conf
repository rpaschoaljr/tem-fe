# ZAP baseline scan rule configuration file
# Formato: ID_REGRA\tACAO\tNOME_DA_REGRA
10049	IGNORE	Storable and Cacheable / Non-Storable Content (Segurança: travamos no-store de propósito nas rotas HTML para evitar vazamento em cache local)
10055	IGNORE	CSP: style-src unsafe-inline (Compatibilidade: exigido pelo Angular CLI para injeção de estilos de componentes)
10096	IGNORE	Timestamp Disclosure - Unix (Falso positivo gerado por constantes numéricas do SDK do Firebase)
10109	IGNORE	Modern Web Application (Informativo do ZAP constatando que é uma SPA em Angular)
10110	IGNORE	Dangerous JS Functions (Falso positivo de compatibilidade com navegadores legados no zone.js do Angular)
90034	IGNORE	Cloud Metadata Potentially Exposed (Lento: gera timeouts de conexão locais na rede 169.254.169.254)
40046	IGNORE	Server Side Request Forgery (SSRF) (Lento: depende de OAST/callback externo e causa timeouts locais)
90035	IGNORE	Server-Side Template Injection (Irrelevante: não usamos templates no backend e gera falsos testes)
90036	IGNORE	Server-Side Template Injection (Blind) (Lento: injeta comandos de sleep 15s gerando centenas de timeouts e logs de erro)
40015	IGNORE	LDAP Injection (Irrelevante: não usamos serviços de diretório LDAP na stack de Firebase)
90025	IGNORE	Expression Language Injection (Irrelevante: regra específica para servidores Java/JSP e evita timeouts lentos)
40040	IGNORE	CORS Misconfiguration (Falso positivo de desenvolvimento: gerado pelo Access-Control-Allow-Origin: * do dev-server do Vite)

