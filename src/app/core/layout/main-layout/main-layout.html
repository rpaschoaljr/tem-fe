<div class="layout-container">

    <!-- BARRA SUPERIOR (Horizontal) -->
    <mat-toolbar color="primary" class="topbar">
        <!-- Hambúrguer para telas < 960px -->
        <button type="button" mat-icon-button (click)="drawer.toggle()" *ngIf="isSmallScreen$ | async">
            <mat-icon>menu</mat-icon>
        </button>

        <span class="logo-text" [routerLink]="['/dashboard']" style="cursor: pointer;">
            <span class="logo-badge">TF</span>
            <span class="logo-full">Tem-Fé ERP</span>
        </span>

        <!-- NAVEGAÇÃO DESKTOP (>= 960px) -->
        <div class="desktop-nav" *ngIf="!(isSmallScreen$ | async)">
            <button mat-button *ngFor="let item of menuItems()" [routerLink]="item.route" routerLinkActive="active-nav">
                <mat-icon>{{ item.icon }}</mat-icon>
                <span>{{ item.label }}</span>
            </button>
            <mat-progress-bar mode="indeterminate" *ngIf="menuLoading()" class="nav-loader"></mat-progress-bar>
        </div>

        <span class="spacer"></span>

        <!-- PERFIL USUÁRIO COM MENU -->
        <div class="topbar-user" [matMenuTriggerFor]="userMenu" *ngIf="currentUser$ | async as user">
            <ng-container *ngIf="member$ | async as member">
                <img *ngIf="member.photoUrl || user.photoURL; else noPhoto"
                     [src]="member.photoUrl || user.photoURL"
                     class="mini-avatar">
            </ng-container>
            <ng-template #noPhoto>
                <mat-icon class="mini-avatar-icon">account_circle</mat-icon>
            </ng-template>
            <span class="user-name-top" *ngIf="!(isSmallScreen$ | async)">
                {{ (member$ | async)?.name || user.displayName || 'Usuário' }}
            </span>
            <mat-icon class="arrow-down">keyboard_arrow_down</mat-icon>
        </div>

        <!-- DEFINIÇÃO DO MENU DROP-DOWN -->
        <mat-menu #userMenu="matMenu" xPosition="before" class="user-dropdown-menu">
            <div class="menu-header" *ngIf="currentUser$ | async as user">
                <span class="menu-name">{{ (member$ | async)?.name || user.displayName || 'Usuário' }}</span>
                <span class="menu-email">{{ user.email }}</span>
            </div>
            <mat-divider></mat-divider>
            
            <button mat-menu-item [routerLink]="['/profile']">
                <mat-icon>person</mat-icon>
                <span>Meu Perfil</span>
            </button>

            <!-- NOVO: Configurações do Sistema (Admin) -->
            <button mat-menu-item [routerLink]="['/settings']" *ngIf="isAdmin$ | async">
                <mat-icon>settings</mat-icon>
                <span>Configurações</span>
            </button>

            <button mat-menu-item (click)="themeService.toggle()">
                <mat-icon>{{ themeService.darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
                <span>Tema: {{ themeService.darkMode() ? 'Claro' : 'Escuro' }}</span>
            </button>

            <mat-divider></mat-divider>

            <button mat-menu-item (click)="logout()">
                <mat-icon color="warn">logout</mat-icon>
                <span style="color: var(--mat-sys-error);">Sair do Sistema</span>
            </button>
        </mat-menu>
    </mat-toolbar>

    <!-- CONTAINER PRINCIPAL -->
    <mat-sidenav-container class="sidenav-container">

        <!-- MENU LATERAL (Telas < 960px) -->
        <mat-sidenav #drawer class="sidenav" 
            [attr.role]="(isSmallScreen$ | async) ? 'dialog' : 'navigation'"
            [mode]="(isSmallScreen$ | async) ? 'over' : 'side'" 
            [opened]="!(isSmallScreen$ | async) ? false : isSidebarOpened">

            <div class="mobile-drawer-header" *ngIf="currentUser$ | async as user">
                <img *ngIf="user.photoURL as photoUrl; else noPhoto" [src]="photoUrl" class="avatar-img">
                <ng-template #noPhoto>
                    <mat-icon class="avatar">account_circle</mat-icon>
                </ng-template>
                <span class="name">{{ user.displayName || 'Usuário' }}</span>
            </div>

            <mat-nav-list>
                <a mat-list-item *ngFor="let item of menuItems()" [routerLink]="item.route" routerLinkActive="active-link"
                    (click)="drawer.close()">
                    <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
                    <span matListItemTitle>{{ item.label }}</span>
                </a>
            </mat-nav-list>
        </mat-sidenav>

        <!-- CONTEÚDO DA PÁGINA -->
        <mat-sidenav-content>
            <div class="content-wrapper">
                <router-outlet></router-outlet>
            </div>
        </mat-sidenav-content>

    </mat-sidenav-container>
</div>
