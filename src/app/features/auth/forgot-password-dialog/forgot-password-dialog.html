<h2 mat-dialog-title>Primeiro Acesso ou Esqueci Minha Senha</h2>
<mat-dialog-content>
  <p>Informe o seu e-mail cadastrado para receber um link de definição de senha.</p>
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Seu e-mail</mat-label>
    <input matInput [(ngModel)]="email" type="email" placeholder="exemplo@email.com" [disabled]="loading">
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" [disabled]="loading">CANCELAR</button>
  <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="!email || loading">
    <span *ngIf="!loading">ENVIAR LINK</span>
    <span *ngIf="loading">ENVIANDO...</span>
  </button>
</mat-dialog-actions>
