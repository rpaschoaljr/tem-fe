<div class="login-container">
    <mat-card class="login-card">
        <mat-card-header>
            <mat-card-title>Tem-Fé ERP</mat-card-title>
            <mat-card-subtitle>Acesso ao Sistema</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Email</mat-label>
                    <input matInput formControlName="email" type="email" placeholder="exemplo@terreiro.com">
                    <mat-error *ngIf="loginForm.get('email')?.hasError('email')">
                        Email inválido
                    </mat-error>
                </mat-form-field>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Senha</mat-label>
                    <input matInput formControlName="password" type="password">
                </mat-form-field>

                <div class="actions">
                    <button mat-button type="button" (click)="openForgotPassword()" class="forgot-btn">
                        Primeiro Acesso / Esqueci Senha
                    </button>

                    <button mat-raised-button color="primary" type="submit" [disabled]="loginForm.invalid || loading" class="w-full h-12 text-lg mt-4">
          <mat-icon *ngIf="loading" class="animate-spin" style="margin-right: 8px;">sync</mat-icon>
          <span *ngIf="!loading">Entrar</span>
          <span *ngIf="loading">Acessando...</span>
        </button>
                </div>

                <!-- REMOVI A LINHA DO ERROR MESSAGE AQUI POIS USAMOS O SNACKBAR AGORA -->

            </form>
        </mat-card-content>
    </mat-card>
</div>
