<div class="first-access-container">
  <mat-card class="first-access-card">
    <mat-card-header>
      <mat-card-title>Primeiro Acesso</mat-card-title>
      <mat-card-subtitle>Bem-vindo ao sistema! Para sua segurança, defina sua senha de acesso.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()">
        <p>Olá, <strong>{{ memberName }}</strong>. Digite sua nova senha abaixo:</p>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nova Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" placeholder="Mínimo 8 caracteres">
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('password')?.hasError('required')">A senha é obrigatória.</mat-error>
          <mat-error *ngIf="form.get('password')?.hasError('minlength')">Mínimo de 8 caracteres.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmar Senha</mat-label>
          <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword">
          <button mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" type="button">
            <mat-icon>{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="form.get('confirmPassword')?.hasError('required')">Confirmação obrigatória.</mat-error>
          <mat-error *ngIf="form.hasError('mismatch')">As senhas não conferem.</mat-error>
        </mat-form-field>

        <div class="actions">
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
            <mat-icon *ngIf="!loading">save</mat-icon>
            <span *ngIf="!loading">DEFINIR SENHA E ACESSAR</span>
            <span *ngIf="loading">SALVANDO...</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
