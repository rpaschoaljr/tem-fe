<div class="page-container">
  <header class="profile-header">
    <div class="header-content">
      <div class="header-text">
        <h1>Meu Perfil</h1>
        <p class="subtitle">Visualize suas informações cadastradas no sistema</p>
      </div>
      <button mat-flat-button color="accent" (click)="openChangePassword()">
        <mat-icon>lock_reset</mat-icon> ALTERAR SENHA
      </button>
    </div>
  </header>

  <div *ngIf="loading()" class="loading-state">
    <p>Carregando perfil...</p>
  </div>

  <div class="profile-grid" *ngIf="!loading() && member() as m">

    <!-- FOTO DE PERFIL E NOME -->
    <mat-card class="profile-main-card full-width">
      <mat-card-content>
        <div class="main-info-container">
          <div class="profile-image-container">
            <img *ngIf="profileImageUrl" class="profile-image" [src]="profileImageUrl" alt="Foto de Perfil">
            <div *ngIf="!profileImageUrl" class="no-profile-image">
              <mat-icon>account_circle</mat-icon>
            </div>
            <label for="profile-input" class="change-photo-btn">
              <mat-icon>camera_alt</mat-icon>
            </label>
            <input id="profile-input" type="file" (change)="onFileSelected($event)" accept="image/*" hidden />
          </div>
          <div class="name-info">
            <h2>{{ m.name }}</h2>
            <p class="role-tag">{{ m.role }}</p>
            <p class="status-tag" [class.active]="m.status === 'Ativo'">{{ m.status }}</p>
          </div>
        </div>
      </mat-card-content>
    </mat-card>

    <!-- SEÇÕES DINÂMICAS -->
    <ng-container *ngFor="let section of profileSections()">
      <mat-card class="dynamic-section-card" [class.full-width]="section === 'Consagrações (Orixás)' || section === 'Informações Adicionais'">
        <mat-card-header>
          <mat-card-title>{{ section }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="info-grid">
            <div class="info-item" *ngFor="let field of getFieldsBySection(section)">
              <label class="info-label">{{ field.label }}</label>
              <div class="info-value">{{ getFieldValue(field) }}</div>
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </ng-container>

    <div class="no-fields-msg full-width" *ngIf="profileSections().length === 0">
      <mat-icon>info_outline</mat-icon>
      <p>Nenhuma informação foi configurada para exibição no seu perfil ainda.</p>
    </div>

  </div>
</div>
