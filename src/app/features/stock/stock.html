<div class="page-container">

    <!-- KPIs (Filtros clicáveis) -->
    <div class="kpi-grid">
        <mat-card class="kpi-card total pointer" (click)="setFilter('all')" [class.active]="stockFilter === 'all'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>inventory_2</mat-icon></div>
                <div class="info">
                    <span class="label">Total de Itens</span>
                    <span class="value">{{ totalItems }}</span>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="kpi-card warning pointer" (click)="setFilter('low')" [class.active]="stockFilter === 'low'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>priority_high</mat-icon></div>
                <div class="info">
                    <span class="label">Estoque Baixo</span>
                    <span class="value">{{ lowStockCount }}</span>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card class="kpi-card danger pointer" (click)="setFilter('out')" [class.active]="stockFilter === 'out'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>no_sim</mat-icon></div>
                <div class="info">
                    <span class="label">Em Falta (Zerado)</span>
                    <span class="value">{{ outOfStockCount }}</span>
                </div>
            </mat-card-content>
        </mat-card>
    </div>

    <!-- REMOVIDO: Botão Novo Item (Agora fica em Configurações) -->

    <!-- LISTA DE MOVIMENTAÇÃO -->
    <mat-card>
        <mat-card-content>
            <h3>Inventário e Movimentação</h3>
            <p class="subtitle">Clique em um item para ajustar a quantidade ou ver detalhes.</p>
            
            <app-generic-list 
                [data]="items" 
                [columns]="tableColumns" 
                [showAdjust]="(canWrite$ | async) === true"
                [hideTrash]="true"
                [hideActions]="true"
                [rowClassFn]="getRowClass" 
                (adjustAction)="onAdjust($event)">
            </app-generic-list>
        </mat-card-content>
    </mat-card>
</div>
