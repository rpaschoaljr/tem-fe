<h2 mat-dialog-title>Ajustar Estoque — {{ item.name }}</h2>

<mat-dialog-content>
  <p style="opacity:0.7; margin-top:0; text-align: center;">
    Qtd. atual: <strong>{{ item.quantity }} {{ item.unit }}</strong>
  </p>

  <form [formGroup]="form" class="adjust-container">
    <div class="quantity-selector">
      <button type="button" mat-fab color="warn" (click)="adjust(-1)" [disabled]="form.get('quantity')?.value! <= 1">
        <mat-icon>remove</mat-icon>
      </button>

      <mat-form-field appearance="outline" class="qty-input">
        <mat-label>Qtd.</mat-label>
        <input matInput type="number" formControlName="quantity" min="1" readonly>
      </mat-form-field>

      <button type="button" mat-fab color="primary" (click)="adjust(1)">
        <mat-icon>add</mat-icon>
      </button>
    </div>
    <p class="hint">Clique nos botões ou digite a quantidade de {{ item.unit }}</p>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">CANCELAR</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="form.invalid">
    CONFIRMAR
  </button>
</mat-dialog-actions>

<style>
  .adjust-container {
    padding: 20px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }
  .quantity-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    width: 100%;
  }
  .qty-input {
    width: 100px;
    text-align: center;
  }
  .qty-input ::ng-deep .mat-mdc-form-field-infix {
    text-align: center;
  }
  /* Remove as setas padrão do input number */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  input[type=number] {
    -moz-appearance: textfield;
    font-size: 1.5rem;
    font-weight: bold;
  }
  .hint {
    font-size: 0.85rem;
    opacity: 0.6;
    text-align: center;
  }
</style>
