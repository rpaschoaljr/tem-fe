<h2 mat-dialog-title>{{ isEdit ? 'Editar Lançamento' : 'Novo Lançamento' }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" class="form-grid">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Descrição</mat-label>
      <input matInput formControlName="description" placeholder="Ex: Doação da Gira">
      <mat-error>Obrigatório (mín. 3 caracteres)</mat-error>
    </mat-form-field>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Tipo</mat-label>
        <mat-select formControlName="type">
          <mat-option value="Entrada">Entrada</mat-option>
          <mat-option value="Saída">Saída</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Categoria</mat-label>
        <mat-select formControlName="category">
          <mat-option *ngFor="let c of categories" [value]="c">{{ c }}</mat-option>
        </mat-select>
        <mat-error>Obrigatório</mat-error>
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline">
        <mat-label>Valor (R$)</mat-label>
        <input matInput type="number" formControlName="value" placeholder="0,00" min="0.01" step="0.01">
        <mat-error>Informe um valor maior que zero</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data</mat-label>
        <input matInput type="text" [matDatepicker]="picker" formControlName="date"
               appInputMask="date" maxlength="10" placeholder="DD/MM/AAAA">
        <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker></mat-datepicker>
        <mat-error>Obrigatório</mat-error>
      </mat-form-field>
    </div>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">CANCELAR</button>
  <button mat-raised-button color="primary" (click)="onSubmit()">
    {{ isEdit ? 'SALVAR' : 'LANÇAR' }}
  </button>
</mat-dialog-actions>

<style>
  .form-grid { display: flex; flex-direction: column; gap: 0; min-width: 380px; padding-top: 8px; }
  .row { display: flex; gap: 12px; }
  .row mat-form-field { flex: 1; }
  .full-width { width: 100%; }
</style>
