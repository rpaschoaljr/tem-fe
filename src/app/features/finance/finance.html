<div class="page-container">

    <!-- CARDS DE KPI (Resumo Financeiro) -->
    <div class="kpi-grid">

        <!-- Entrada -->
        <mat-card class="kpi-card income pointer" (click)="setFilter('income')" [class.active]="typeFilter === 'income'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>arrow_upward</mat-icon></div>
                <div class="info">
                    <span class="label">Entradas</span>
                    <span class="value">{{ totalIncome | currency:'BRL' }}</span>
                </div>
            </mat-card-content>
        </mat-card>

        <!-- Saída -->
        <mat-card class="kpi-card expense pointer" (click)="setFilter('expense')" [class.active]="typeFilter === 'expense'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>arrow_downward</mat-icon></div>
                <div class="info">
                    <span class="label">Saídas</span>
                    <span class="value">{{ totalExpense | currency:'BRL' }}</span>
                </div>
            </mat-card-content>
        </mat-card>

        <!-- Saldo -->
        <mat-card class="kpi-card balance pointer" (click)="setFilter('all')" [class.active]="typeFilter === 'all'">
            <mat-card-content>
                <div class="icon-box"><mat-icon>account_balance_wallet</mat-icon></div>
                <div class="info">
                    <span class="label">Saldo em Caixa</span>
                    <span class="value" [class.negative]="totalBalance < 0">
                        {{ totalBalance | currency:'BRL' }}
                    </span>
                </div>
            </mat-card-content>
        </mat-card>

    </div>

    <!-- BOTÕES DE AÇÃO -->
    <div class="actions-row" *ngIf="canWrite$ | async">
        <button mat-raised-button color="primary" (click)="onNewTransaction()">
            <mat-icon>add</mat-icon> Novo Lançamento
        </button>
        <button mat-stroked-button color="accent" (click)="openSchedules()">
            <mat-icon>schedule</mat-icon> Agendamentos
        </button>
        <button mat-stroked-button color="primary" routerLink="/finance/report">
            <mat-icon>bar_chart</mat-icon> Relatório DRE
        </button>
    </div>

    <!-- FILTRO POR PERÍODO E BUSCA -->
    <div class="filter-row">
        <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Mês</mat-label>
            <mat-select [(ngModel)]="selectedMonth" (ngModelChange)="applyFilter()">
                <mat-option [value]="null">Todos</mat-option>
                <mat-option *ngFor="let m of months" [value]="m.value">{{ m.label }}</mat-option>
            </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="filter-field">
            <mat-label>Ano</mat-label>
            <mat-select [(ngModel)]="selectedYear" (ngModelChange)="applyFilter()">
                <mat-option [value]="null">Todos</mat-option>
                <mat-option *ngFor="let y of years" [value]="y">{{ y }}</mat-option>
            </mat-select>
        </mat-form-field>

        <button mat-icon-button (click)="clearFilter()" matTooltip="Limpar filtro" *ngIf="selectedMonth !== null || selectedYear !== null">
            <mat-icon>filter_alt_off</mat-icon>
        </button>
    </div>

    <!-- LISTA DE LANÇAMENTOS -->
    <mat-card>
        <mat-card-content>
            <div class="header-with-actions">
                <div class="title-group">
                    <h3>Extrato Financeiro</h3>
                </div>
                <div class="actions-group">
                    <button mat-stroked-button color="primary" (click)="exportFinance()" [disabled]="exportData.length === 0">
                        <mat-icon>download</mat-icon>
                        Exportar CSV
                    </button>
                </div>
            </div>

            <app-generic-list [data]="transactions" [columns]="tableColumns" 
                [hideActions]="!(canWrite$ | async)"
                (filteredDataChange)="exportData = $event"
                (editAction)="onEdit($event)"
                (deleteAction)="onDelete($event)" (restoreAction)="onRestore($event)">
            </app-generic-list>

        </mat-card-content>
    </mat-card>

</div>
