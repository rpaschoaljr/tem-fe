<div class="generic-list-container">

    <div class="search-header">
        <mat-form-field appearance="outline" class="search-bar">
            <mat-label>Pesquisar...</mat-label>
            <mat-icon matPrefix>search</mat-icon>
            <input matInput (keyup)="applyFilter($event)" placeholder="Digite nome, email, etc..." #input>
            <button *ngIf="input.value" matSuffix mat-icon-button (click)="input.value=''; applyFilter($event)">
                <mat-icon>close</mat-icon>
            </button>
        </mat-form-field>

        <button mat-icon-button [color]="showDeleted ? 'warn' : ''" (click)="toggleDeletedMode()"
            matTooltip="Ver Lixeira">
            <mat-icon>{{ showDeleted ? 'restore_from_trash' : 'delete_outline' }}</mat-icon>
        </button>
    </div>

    <div class="table-container mat-elevation-z2">
        <table mat-table [dataSource]="dataSource" matSort>

            <ng-container *ngFor="let col of columns" [matColumnDef]="col.def">
                <th mat-header-cell *matHeaderCellDef mat-sort-header> {{col.label}} </th>

                <td mat-cell *matCellDef="let element">

                    <!-- Lógica de Formatação -->
                    <ng-container [ngSwitch]="col.type">

                        <!-- Se for DATA -->
                        <span *ngSwitchCase="'date'">
                            {{ element[col.def] | date:'dd/MM/yyyy' }}
                        </span>

                        <!-- Se for MOEDA (Currency) -->
                        <span *ngSwitchCase="'currency'" [style.color]="element[col.def] < 0 ? '#ff5252' : '#69f0ae'"
                            style="font-weight: 500;">
                            {{ element[col.def] | currency:'BRL' }}
                        </span>

                        <!-- Se for Texto Normal -->
                        <span *ngSwitchDefault>{{ element[col.def] }}</span>

                    </ng-container>

                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef> Ações </th>
                <td mat-cell *matCellDef="let element">
                    <ng-container *ngIf="!element.deleted">
                        <button mat-icon-button color="primary" (click)="editAction.emit(element)">
                            <mat-icon>edit</mat-icon>
                        </button>
                        <button mat-icon-button color="warn" (click)="confirmDelete(element)">
                            <mat-icon>delete</mat-icon>
                        </button>
                    </ng-container>
                    <ng-container *ngIf="element.deleted">
                        <button mat-flat-button color="accent" (click)="restoreAction.emit(element)">
                            RESTAURAR
                        </button>
                    </ng-container>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

            <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="4">Nenhum registro encontrado.</td>
            </tr>
        </table>
        <mat-paginator [pageSizeOptions]="[20, 50, 100]" showFirstLastButtons></mat-paginator>
    </div>
</div>
