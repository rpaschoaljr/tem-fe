services:
  firebase-emulators:
    build:
      context: .
      dockerfile: Dockerfile.emulators
    container_name: tem-fe-emulators
    environment:
      - FIREBASE_PROJECT=${FIREBASE_PROJECT:-demo-sistematemfe}
    ports:
      - "${FIREBASE_UI_PORT:-4000}:4000"
      - "${FIREBASE_HUB_PORT:-4400}:4400"
      - "${FIREBASE_AUTH_PORT:-9099}:9099"
      - "${FIREBASE_FIRESTORE_PORT:-8080}:8080"
      - "${FIREBASE_STORAGE_PORT:-9199}:9199"
      - "${FIREBASE_FUNCTIONS_PORT:-5001}:5001"
      - "${FIREBASE_HOSTING_PORT:-5000}:5000"
    volumes:
      # Persiste os dados dos emuladores entre reinicializações
      - emulator-data:/app/emulator-data
      # Permite recarregar as rules sem rebuild da imagem
      - ./firestore.rules:/app/firestore.rules:ro
      - ./storage.rules:/app/storage.rules:ro
      - ./functions:/app/functions
      # Preserva node_modules e lib/ da imagem (evita que o bind mount do host sobrescreva)
      - /app/functions/node_modules
      - /app/functions/lib
      # Cache dos binários dos emuladores (evita re-extração de JARs)
      - emulator-cache:/root/.cache/firebase
      # Permite que o emulador de Hosting sirva os arquivos buildados no host
      - ./dist:/app/dist:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9099/', r => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  emulator-data:
  emulator-cache:
